<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐥 OpenClaw 控制台 v2.0 - 体重管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #16213e;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
    }
    header h1 { font-size: 18px; color: #FF8C42; display: flex; align-items: center; gap: 10px; }
    .version-tag {
      font-size: 11px;
      background: #FF8C42;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: normal;
    }
    .mode-tag {
      font-size: 11px;
      background: #67c23a;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: normal;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #666;
      transition: background 0.3s;
    }
    .status-dot.ready { background: #67c23a; box-shadow: 0 0 8px #67c23a; }
    .status-dot.error { background: #f44336; }
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .iframe-wrap {
      flex: 1;
      position: relative;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    .iframe-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    .iframe-bar input {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    .iframe-bar button {
      background: #FF8C42;
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .iframe-bar button:hover { background: #e67a32; }
    .panel {
      width: 400px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
    }
    .panel h2 {
      font-size: 14px;
      padding: 12px 16px;
      border-bottom: 1px solid #0f3460;
      color: #FFD93D;
    }
    .controls {
      padding: 12px 16px;
      overflow-y: auto;
      flex: 1;
    }
    .control-group {
      margin-bottom: 16px;
    }
    .control-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .control-group input, .control-group select, .control-group textarea {
      width: 100%;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    .control-group textarea {
      resize: vertical;
      font-family: 'Menlo', 'Monaco', monospace;
      min-height: 60px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      flex: 1;
      min-width: 80px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover { background: #1a4a7a; }
    .btn.primary { background: #FF8C42; border-color: #FF8C42; }
    .btn.primary:hover { background: #e67a32; }
    .btn.success { background: #67c23a; border-color: #67c23a; }
    .btn.success:hover { background: #5daf34; }
    .btn.danger { background: #f44336; border-color: #f44336; }
    .btn.danger:hover { background: #d32f2f; }
    .btn.api { background: #409eff; border-color: #409eff; }
    .btn.api:hover { background: #3a8ee6; }
    .logs {
      height: 280px;
      background: #0a0a14;
      border-top: 1px solid #0f3460;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .log-entry {
      margin-bottom: 6px;
      word-break: break-all;
    }
    .log-time { color: #666; margin-right: 8px; }
    .log-send { color: #67c23a; }
    .log-recv { color: #FFD93D; }
    .log-error { color: #f44336; }
    .log-info { color: #409eff; }
    .result-box {
      background: #0f3460;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .divider {
      height: 1px;
      background: #0f3460;
      margin: 12px 0;
    }
    .section-title {
      font-size: 13px;
      color: #FF8C42;
      margin-bottom: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🐥 OpenClaw 控制台 <span class="version-tag">v2.0</span> <span class="mode-tag">API直连模式</span></h1>
    <div class="status">
      <span id="statusText">等待连接...</span>
      <div class="status-dot" id="statusDot"></div>
    </div>
  </header>

  <div class="main">
    <div class="iframe-wrap">
      <div class="iframe-bar">
        <input type="text" id="iframeUrl" value="http://testsu.fun-med.cn/?userId=1#/pages/weight/weight" placeholder="输入 uni-app H5 地址">
        <button onclick="loadIframe()">加载页面</button>
      </div>
      <iframe id="appFrame" src=""></iframe>
    </div>

    <div class="panel">
      <h2>🎮 操作面板</h2>
      <div class="controls">
        
        <!-- 登录设置 -->
        <div class="control-group">
          <label>用户 ID（先设置再操作）</label>
          <input type="text" id="userIdInput" placeholder="例如: 1" value="1">
          <label style="display:flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer">
            <input type="checkbox" id="autoLogin" checked style="width:auto">
            <span style="font-size:12px;color:#ccc">页面加载后自动注入 userId</span>
          </label>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn primary" onclick="sendCmd('setUserId', {userId: document.getElementById('userIdInput').value})">设置用户ID</button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 快速操作 -->
        <div class="control-group">
          <label>快速操作</label>
          <div class="btn-row">
            <button class="btn" onclick="sendCmd('getPageInfo')">页面信息</button>
            <button class="btn" onclick="sendCmd('getWeightData')">获取体重数据</button>
          </div>
        </div>

        <!-- 记录体重 -->
        <div class="control-group">
          <label>记录体重</label>
          <input type="number" id="recordWeight" placeholder="体重 (kg)" value="65.5" step="0.1">
          <input type="date" id="recordDate" style="margin-top:6px">
          <input type="text" id="recordRemark" placeholder="备注（选填）" style="margin-top:6px">
          <div class="btn-row" style="margin-top:8px">
            <button class="btn success" onclick="recordWeight()">一键记录体重</button>
          </div>
        </div>

        <!-- 编辑体重 -->
        <div class="control-group">
          <label>编辑体重</label>
          <input type="text" id="editId" placeholder="记录ID" style="margin-bottom:6px">
          <input type="number" id="editWeight" placeholder="新体重 (kg)" value="66.0" step="0.1">
          <input type="date" id="editDate" style="margin-top:6px">
          <div class="btn-row" style="margin-top:8px">
            <button class="btn primary" onclick="editWeight()">修改体重</button>
          </div>
        </div>

        <!-- 删除体重 -->
        <div class="control-group">
          <label>删除体重</label>
          <input type="text" id="deleteId" placeholder="记录ID">
          <div class="btn-row" style="margin-top:8px">
            <button class="btn danger" onclick="deleteWeight()">删除记录</button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 通用API调用 -->
        <div class="control-group">
          <div class="section-title">🌐 通用API调用</div>
          <label>Endpoint</label>
          <input type="text" id="apiEndpoint" placeholder="例如: /api/weight/stats">
          <label style="margin-top:6px">Method</label>
          <select id="apiMethod" onchange="toggleApiBody()">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
          <div id="apiBodyWrap" style="display:none;margin-top:6px">
            <label>Body (JSON)</label>
            <textarea id="apiBody" placeholder='{"key": "value"}'></textarea>
          </div>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn api" onclick="sendApiRequest()">发送API请求</button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 原始指令 -->
        <div class="control-group">
          <div class="section-title">⚡ 原始指令</div>
          <label>指令类型</label>
          <select id="rawAction" onchange="updateParamTemplate()">
            <option value="recordWeight">recordWeight</option>
            <option value="getWeightData">getWeightData</option>
            <option value="editWeight">editWeight</option>
            <option value="deleteWeight">deleteWeight</option>
            <option value="callApi">callApi</option>
            <option value="navigate">navigate</option>
            <option value="getPageInfo">getPageInfo</option>
            <option value="click">click</option>
            <option value="input">input</option>
            <option value="getValue">getValue</option>
            <option value="getText">getText</option>
          </select>
          <label style="margin-top:6px">参数 (JSON)</label>
          <textarea id="rawParams" rows="3" placeholder='{"key": "value"}'></textarea>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn" onclick="sendRaw()">发送原始指令</button>
          </div>
        </div>

        <!-- 最新结果 -->
        <div class="control-group">
          <label>最新响应</label>
          <div class="result-box" id="resultBox">等待响应...</div>
        </div>
      </div>

      <div class="logs" id="logs"></div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('appFrame');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const logsEl = document.getElementById('logs');
    const resultBox = document.getElementById('resultBox');
    
    let bridgeReady = false;
    let requestId = 0;
    const pending = new Map();
    let autoLoginSent = false;

    // 指令参数模板
    const paramTemplates = {
      recordWeight: '{"weight": 65.5, "date": "", "remark": ""}',
      getWeightData: '{}',
      editWeight: '{"id": "", "weight": 66.0, "date": ""}',
      deleteWeight: '{"id": ""}',
      callApi: '{"endpoint": "/api/weight/stats", "method": "GET", "data": null}',
      navigate: '{"page": "/pages/weight/weight"}',
      getPageInfo: '{}',
      click: '{"text": "记录体重"}',
      input: '{"selector": "input", "value": "", "clear": true}',
      getValue: '{"selector": "input"}',
      getText: '{"selector": ".title"}'
    };

    // 初始化日期输入框为今天
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('recordDate').value = today;
    document.getElementById('editDate').value = today;

    // 初始化原始指令参数模板
    updateParamTemplate();

    // 加载 iframe
    function loadIframe() {
      let url = document.getElementById('iframeUrl').value.trim();
      if (!url) return alert('请输入地址');
      
      // 自动把 userId 拼到 URL 上（如果还没拼的话）
      const uid = document.getElementById('userIdInput').value.trim();
      if (uid && !url.includes('userId=')) {
        if (url.includes('#')) {
          url = url.replace('#', '?userId=' + uid + '#');
        } else {
          url += '?userId=' + uid;
        }
        document.getElementById('iframeUrl').value = url;
      }
      
      bridgeReady = false;
      autoLoginSent = false;
      updateStatus('加载中...', '');
      iframe.src = url;
      log('加载页面: ' + url, 'info');
    }

    // 状态更新
    function updateStatus(text, type) {
      statusText.textContent = text;
      statusDot.className = 'status-dot' + (type ? ' ' + type : '');
    }

    // 日志
    function log(msg, type = 'info') {
      const time = new Date().toLocaleTimeString('zh-CN', {hour12:false});
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML = `<span class="log-time">${time}</span><span class="log-${type}">${escapeHtml(msg)}</span>`;
      logsEl.appendChild(div);
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 监听 iframe 消息
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || !data.type) return;

      if (data.type === 'OPENCLAW_READY') {
        bridgeReady = true;
        updateStatus('已连接 (' + (data.version||'') + ')', 'ready');
        log('✅ 页面就绪: ' + JSON.stringify(data), 'recv');
        
        // 自动注入 userId
        const uid = document.getElementById('userIdInput').value.trim();
        const autoLogin = document.getElementById('autoLogin').checked;
        if (autoLogin && uid && !autoLoginSent) {
          autoLoginSent = true;
          setTimeout(() => {
            log('🔄 自动注入 userId: ' + uid, 'info');
            sendCmd('setUserId', { userId: uid });
          }, 500);
        }
        return;
      }

      if (data.type === 'OPENCLAW_RESPONSE') {
        const duration = pending.has(data.id) ? Date.now() - pending.get(data.id) : 0;
        pending.delete(data.id);
        
        const summary = data.success 
          ? '✅ 成功' + (duration ? ` (${duration}ms)` : '')
          : '❌ 失败: ' + (data.error || '未知错误');
        
        log(`[${data.id}] ${summary}`, data.success ? 'recv' : 'error');
        
        if (data.data) {
          const pretty = JSON.stringify(data.data, null, 2);
          log('响应数据:\n' + pretty, 'recv');
          resultBox.textContent = pretty;
        }
        return;
      }
    });

    // 发送指令
    function sendCmd(action, params = {}) {
      if (!bridgeReady) {
        log('❌ Bridge 未就绪，请先加载页面', 'error');
        return;
      }
      
      const id = ++requestId;
      pending.set(id, Date.now());
      
      const payload = {
        type: 'OPENCLAW_REQUEST',
        id: String(id),
        action,
        params
      };
      
      iframe.contentWindow.postMessage(payload, '*');
      log(`📤 [${id}] ${action} ${JSON.stringify(params)}`, 'send');
    }

    // 记录体重
    function recordWeight() {
      const weight = parseFloat(document.getElementById('recordWeight').value);
      const date = document.getElementById('recordDate').value;
      const remark = document.getElementById('recordRemark').value.trim();
      if (!weight) return alert('请输入体重');
      const params = { weight, date };
      if (remark) params.remark = remark;
      sendCmd('recordWeight', params);
    }

    // 编辑体重
    function editWeight() {
      const id = document.getElementById('editId').value.trim();
      const weight = parseFloat(document.getElementById('editWeight').value);
      const date = document.getElementById('editDate').value;
      if (!id) return alert('请输入记录ID');
      if (isNaN(weight)) return alert('请输入新体重');
      const params = { id, weight };
      if (date) params.date = date;
      sendCmd('editWeight', params);
    }

    // 删除体重
    function deleteWeight() {
      const id = document.getElementById('deleteId').value.trim();
      if (!id) return alert('请输入记录ID');
      sendCmd('deleteWeight', { id });
    }

    // 通用API调用
    function sendApiRequest() {
      const endpoint = document.getElementById('apiEndpoint').value.trim();
      const method = document.getElementById('apiMethod').value;
      if (!endpoint) return alert('请输入 Endpoint');

      const params = { endpoint, method };

      if (method === 'POST' || method === 'PUT') {
        const bodyStr = document.getElementById('apiBody').value.trim();
        if (bodyStr) {
          try {
            params.data = JSON.parse(bodyStr);
          } catch(e) {
            return alert('Body JSON 格式错误');
          }
        }
      }
      sendCmd('callApi', params);
    }

    // 切换 API Body 显示
    function toggleApiBody() {
      const method = document.getElementById('apiMethod').value;
      const wrap = document.getElementById('apiBodyWrap');
      wrap.style.display = (method === 'POST' || method === 'PUT') ? 'block' : 'none';
    }

    // 更新参数模板
    function updateParamTemplate() {
      const action = document.getElementById('rawAction').value;
      const template = paramTemplates[action] || '{}';
      document.getElementById('rawParams').value = template;
    }

    // 发送原始指令
    function sendRaw() {
      const action = document.getElementById('rawAction').value;
      let params = {};
      try {
        params = JSON.parse(document.getElementById('rawParams').value || '{}');
      } catch(e) {
        return alert('参数 JSON 格式错误');
      }
      sendCmd(action, params);
    }

    // 默认自动加载（如果地址已填）
    window.onload = () => {
      const url = document.getElementById('iframeUrl').value.trim();
      if (url) loadIframe();
    };

    // iframe 跳转后重置自动登录标记
    iframe.addEventListener('load', () => {
      autoLoginSent = false;
    });
  </script>
</body>
</html>
